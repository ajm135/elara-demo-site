<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A stylized cell with a darker nucleus being studied inside a circular microscope field, with a ring of short data marks around the field</title>
  <rect x="0" y="0" width="1200" height="630" rx="48" fill="#f6f1e7"/>
  <!-- overlapping translucent shapes -->
  <circle cx="880" cy="140" r="170" fill="#0e6b63" opacity="0.10"/>
  <circle cx="240" cy="500" r="130" fill="#c9842a" opacity="0.12"/>
  <!-- microscope field of view -->
  <circle cx="600" cy="315" r="210" fill="#d7e6e3" stroke="#0a544e" stroke-width="12"/>
  <circle cx="600" cy="315" r="162" fill="none" stroke="#0e6b63" stroke-width="4" opacity="0.5"/>
  <!-- stylized cell with darker nucleus -->
  <circle cx="585" cy="320" r="118" fill="#0e6b63"/>
  <circle cx="617" cy="297" r="48" fill="#0a544e"/>
  <circle cx="545" cy="362" r="11" fill="#0a544e" opacity="0.55"/>
  <circle cx="642" cy="372" r="8" fill="#0a544e" opacity="0.55"/>
  <circle cx="556" cy="262" r="7" fill="#f6f1e7" opacity="0.7"/>
  <!-- ring of short data marks around the field -->
  <g stroke="#0a544e" stroke-width="7" stroke-linecap="round">
    <line x1="838" y1="315" x2="868" y2="315"/>
    <line x1="806.1" y1="434" x2="821.7" y2="443"/>
    <line x1="719" y1="521.1" x2="734" y2="547.1"/>
    <line x1="481" y1="521.1" x2="466" y2="547.1"/>
    <line x1="393.9" y1="434" x2="378.3" y2="443"/>
    <line x1="362" y1="315" x2="332" y2="315"/>
    <line x1="393.9" y1="196" x2="378.3" y2="187"/>
    <line x1="481" y1="108.9" x2="466" y2="82.9"/>
    <line x1="600" y1="77" x2="600" y2="59"/>
    <line x1="719" y1="108.9" x2="734" y2="82.9"/>
    <line x1="806.1" y1="196" x2="821.7" y2="187"/>
  </g>
  <g stroke="#c9842a" stroke-width="7" stroke-linecap="round">
    <line x1="600" y1="553" x2="600" y2="571"/>
  </g>
  <!-- a few stray data marks -->
  <circle cx="320" cy="490" r="9" fill="#0e6b63"/>
  <circle cx="876" cy="122" r="8" fill="#c9842a"/>
</svg>
