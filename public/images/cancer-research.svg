<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A stylized cell under a microscope, ringed with abstract data marks</title>
  <rect x="0" y="0" width="1200" height="630" fill="#F2F6FA"/>
  <!-- microscope field of view -->
  <circle cx="600" cy="315" r="250" fill="#DDEBF5" stroke="#4E79A7" stroke-width="10"/>
  <circle cx="600" cy="315" r="228" fill="none" stroke="#9FC1DC" stroke-width="3" stroke-dasharray="4 10"/>
  <!-- stylized cell with nucleus -->
  <ellipse cx="600" cy="318" rx="112" ry="92" fill="#F4978E" opacity="0.9"/>
  <ellipse cx="600" cy="318" rx="112" ry="92" fill="none" stroke="#C05A50" stroke-width="6"/>
  <circle cx="622" cy="300" r="46" fill="#C05A50"/>
  <circle cx="556" cy="352" r="14" fill="#C05A50" opacity="0.55"/>
  <circle cx="648" cy="364" r="10" fill="#C05A50" opacity="0.55"/>
  <circle cx="566" cy="272" r="9" fill="#C05A50" opacity="0.55"/>
  <!-- ring of tick marks around the microscope field -->
  <g stroke="#4E79A7" stroke-width="6" stroke-linecap="round">
    <line x1="600" y1="47" x2="600" y2="23"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(30 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(60 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(90 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(120 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(150 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(180 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(210 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(240 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(270 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(300 600 315)"/>
    <line x1="600" y1="47" x2="600" y2="23" transform="rotate(330 600 315)"/>
  </g>
  <!-- abstract data marks -->
  <path d="M980 124 v32 M964 140 h32" stroke="#C44536" stroke-width="8" stroke-linecap="round"/>
  <circle cx="210" cy="150" r="9" fill="#4EA5D9"/>
  <circle cx="1010" cy="470" r="11" fill="#6FCF97"/>
  <circle cx="170" cy="470" r="8" fill="#FFD166"/>
  <g fill="#4E79A7">
    <rect x="860" y="560" width="10" height="24" rx="3"/>
    <rect x="876" y="548" width="10" height="36" rx="3"/>
    <rect x="892" y="536" width="10" height="48" rx="3"/>
  </g>
  <line x1="250" y1="520" x2="330" y2="560" stroke="#8AD1E8" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
</svg>
