<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A long road toward the horizon with trees growing taller along the way</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EC9E8"/>
      <stop offset="0.75" stop-color="#D7EDF7"/>
      <stop offset="1" stop-color="#FFF2CF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="400" fill="url(#sky)"/>
  <circle cx="170" cy="120" r="52" fill="#FFD166"/>
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="420" cy="110" rx="70" ry="22"/>
    <ellipse cx="480" cy="96" rx="50" ry="18"/>
    <ellipse cx="880" cy="160" rx="80" ry="22"/>
    <ellipse cx="950" cy="146" rx="48" ry="16"/>
  </g>
