<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A long road narrowing toward the horizon under a wide sky, with trees of stacked round canopies on both sides that grow taller toward the foreground</title>
  <!--
    Flat drawing in the ADR 0008 palette. The light theme is drawn with
    literal fills (the reference's white and pale blue-grey surfaces, its
    blue accent and its remaining accent colours). The dark theme swaps
    the light surfaces for the reference's dark surfaces and the dark ink
    for the light ink, and lifts the blue accent to the reference's light
    blue, so the drawing reads the same way in both themes. No JavaScript:
    the dark rule is a CSS rule inside the file.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .field { fill: #191919; }
      .sky { fill: #2c343b; }
      .paper { fill: #f1f3f9; }
      .accent { fill: #55bbeb; }
      .road { fill: #191919; }
    }
  </style>
  <!-- full-canvas field -->
  <rect x="0" y="0" width="1200" height="630" rx="48" fill="#ffffff" class="field"/>
  <!-- wide sky -->
  <rect x="64" y="64" width="1072" height="330" rx="40" fill="#f1f3f9" class="sky"/>
  <!-- sun and soft glow -->
  <circle cx="250" cy="170" r="80" fill="#f5bf2f" opacity="0.18"/>
  <circle cx="250" cy="170" r="46" fill="#f5bf2f"/>
  <!-- soft translucent clouds -->
  <circle cx="520" cy="150" r="34" fill="#ffffff" class="paper" opacity="0.55"/>
  <circle cx="566" cy="134" r="24" fill="#ffffff" class="paper" opacity="0.55"/>
  <circle cx="830" cy="206" r="28" fill="#ffffff" class="paper" opacity="0.55"/>
  <!-- wide ground, full bleed to the bottom edge -->
  <rect x="0" y="380" width="1200" height="250" fill="#1f6f99" class="accent"/>
  <!-- translucent haze along the horizon -->
  <rect x="0" y="380" width="1200" height="44" fill="#f1f3f9" class="sky" opacity="0.55"/>
  <!-- the long road narrowing toward the horizon -->
  <path d="M 593 388 L 607 388 Q 674 516 765 630 L 435 630 Q 526 516 593 388 Z" fill="#ffffff" class="road"/>
  <!-- orange centre line, bars shrinking toward the horizon -->
  <rect x="589" y="556" width="22" height="54" rx="11" fill="#f54b0f"/>
  <rect x="591" y="486" width="18" height="42" rx="9" fill="#f54b0f"/>
  <rect x="592" y="434" width="16" height="30" rx="8" fill="#f54b0f"/>
  <rect x="593" y="398" width="14" height="20" rx="7" fill="#f54b0f"/>
  <!-- far trees, small, on both sides -->
  <rect x="481" y="468" width="10" height="14" rx="5" fill="#f1f3f9" class="sky"/>
  <circle cx="486" cy="450" r="22" fill="#84c450"/>
  <circle cx="486" cy="424" r="15" fill="#84c450"/>
  <circle cx="486" cy="402" r="10" fill="#84c450"/>
  <rect x="709" y="468" width="10" height="14" rx="5" fill="#f1f3f9" class="sky"/>
  <circle cx="714" cy="450" r="22" fill="#84c450"/>
  <circle cx="714" cy="424" r="15" fill="#84c450"/>
  <circle cx="714" cy="402" r="10" fill="#84c450"/>
  <!-- middle trees, taller -->
  <rect x="389" y="496" width="14" height="24" rx="7" fill="#f1f3f9" class="sky"/>
  <circle cx="396" cy="474" r="36" fill="#84c450"/>
  <circle cx="396" cy="438" r="25" fill="#84c450"/>
  <circle cx="396" cy="404" r="16" fill="#84c450"/>
  <rect x="797" y="496" width="14" height="24" rx="7" fill="#f1f3f9" class="sky"/>
  <circle cx="804" cy="474" r="36" fill="#84c450"/>
  <circle cx="804" cy="438" r="25" fill="#84c450"/>
  <circle cx="804" cy="404" r="16" fill="#84c450"/>
  <!-- near trees, tallest, framing the foreground -->
  <rect x="260" y="572" width="20" height="44" rx="10" fill="#f1f3f9" class="sky"/>
  <circle cx="270" cy="536" r="60" fill="#84c450"/>
  <circle cx="270" cy="476" r="44" fill="#84c450"/>
  <circle cx="270" cy="418" r="28" fill="#84c450"/>
  <rect x="920" y="572" width="20" height="44" rx="10" fill="#f1f3f9" class="sky"/>
  <circle cx="930" cy="536" r="60" fill="#84c450"/>
  <circle cx="930" cy="476" r="44" fill="#84c450"/>
  <circle cx="930" cy="418" r="28" fill="#84c450"/>
</svg>
