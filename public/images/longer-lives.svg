  <circle cx="768" cy="400" r="21" fill="#5F8C46"/>
  <rect x="376" y="448" width="12" height="32" fill="#8B5E3C"/>
  <circle cx="382" cy="420" r="34" fill="#5F8C46"/>
  <rect x="812" y="448" width="12" height="32" fill="#8B5E3C"/>
