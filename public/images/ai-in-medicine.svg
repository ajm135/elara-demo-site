<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>An abstract network linking a stethoscope, a laboratory flask, and a medical scan</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232B4A"/>
      <stop offset="1" stop-color="#151A30"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <!-- background data network -->
  <g stroke="#3D4B7A" stroke-width="2" opacity="0.7">
    <line x1="120" y1="110" x2="330" y2="80"/>
    <line x1="330" y1="80" x2="520" y2="130"/>
    <line x1="520" y1="130" x2="720" y2="70"/>
    <line x1="720" y1="70" x2="930" y2="120"/>
    <line x1="930" y1="120" x2="1120" y2="90"/>
    <line x1="110" y1="540" x2="320" y2="570"/>
    <line x1="320" y1="570" x2="540" y2="520"/>
    <line x1="540" y1="520" x2="760" y2="565"/>
    <line x1="760" y1="565" x2="980" y2="525"/>
    <line x1="980" y1="525" x2="1130" y2="560"/>
  </g>
  <g fill="#5A6EA8">
    <circle cx="120" cy="110" r="6"/>
    <circle cx="330" cy="80" r="5"/>
    <circle cx="520" cy="130" r="6"/>
    <circle cx="720" cy="70" r="5"/>
    <circle cx="930" cy="120" r="6"/>
    <circle cx="1120" cy="90" r="5"/>
    <circle cx="110" cy="540" r="6"/>
    <circle cx="320" cy="570" r="5"/>
    <circle cx="540" cy="520" r="6"/>
    <circle cx="760" cy="565" r="5"/>
    <circle cx="980" cy="525" r="6"/>
    <circle cx="1130" cy="560" r="5"/>
  </g>
  <!-- connectors between the three panels -->
  <g stroke="#8AD1E8" stroke-width="6" opacity="0.9">
    <line x1="322" y1="320" x2="498" y2="320"/>
    <line x1="702" y1="320" x2="878" y2="320"/>
  </g>
  <g fill="#FFD166">
    <circle cx="410" cy="320" r="10"/>
    <circle cx="790" cy="320" r="10"/>
  </g>
  <!-- panel: stethoscope -->
  <rect x="120" y="220" width="200" height="200" rx="22" fill="#2A3357" stroke="#8AD1E8" stroke-width="4"/>
  <g fill="none" stroke="#8AD1E8" stroke-width="9" stroke-linecap="round">
    <path d="M185 248 v48 a35 35 0 0 0 70 0 v-48"/>
    <path d="M220 331 q0 24 26 36 q22 10 22 28"/>
  </g>
  <circle cx="185" cy="244" r="7" fill="#8AD1E8"/>
  <circle cx="255" cy="244" r="7" fill="#8AD1E8"/>
  <circle cx="268" cy="395" r="18" fill="#FFD166" stroke="#2A3357" stroke-width="4"/>
  <!-- panel: laboratory flask -->
  <rect x="500" y="210" width="200" height="220" rx="22" fill="#2A3357" stroke="#8AD1E8" stroke-width="4"/>
  <path d="M585 240 v34 l-42 118 a14 14 0 0 0 13 19 h88 a14 14 0 0 0 13 -19 l-42 -118 v-34 z" fill="#EAF6FF" opacity="0.92" stroke="#8AD1E8" stroke-width="6" stroke-linejoin="round"/>
  <path d="M561 356 h78 l11 32 a12 12 0 0 1 -12 15 h-76 a12 12 0 0 1 -12 -15 z" fill="#4EA5D9"/>
  <rect x="580" y="230" width="40" height="12" rx="5" fill="#8AD1E8"/>
  <!-- panel: medical scan -->
  <rect x="880" y="220" width="200" height="200" rx="22" fill="#2A3357" stroke="#8AD1E8" stroke-width="4"/>
  <rect x="900" y="240" width="160" height="120" rx="12" fill="#141B33" stroke="#8AD1E8" stroke-width="6"/>
  <path d="M922 300 h30 l14 -34 l22 58 l14 -24 h36" fill="none" stroke="#FFD166" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="966" y="360" width="28" height="14" rx="5" fill="#8AD1E8"/>
  <rect x="940" y="374" width="80" height="12" rx="6" fill="#8AD1E8"/>
</svg>
