<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Four flat icons in a circle - a heart, a cluster of sugar circles, a spiky virus, and a dna helix - joined by lines with small data dots</title>
  <!--
    Flat drawing in the ADR 0008 palette. The light theme is drawn with
    literal fills (the reference's white and pale blue-grey surfaces, its
    blue accent and its remaining accent colours). The dark theme swaps
    the light surfaces for the reference's dark surfaces and the dark ink
    for the light ink, and lifts the blue accent to the reference's light
    blue, so the drawing reads the same way in both themes. No JavaScript:
    the dark rule is a CSS rule inside the file.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .field { fill: #191919; }
      .sky { fill: #2c343b; }
      .panel { fill: #272727; }
      .paper { fill: #f1f3f9; }
      .ink-strong { fill: #ffffff; }
      .accent { fill: #55bbeb; }
      .s-accent { stroke: #55bbeb; }
      .s-ink-strong { stroke: #ffffff; }
    }
  </style>
  <!-- full-canvas field -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff" class="field"/>
  <!-- large soft translucent shapes for depth -->
  <circle cx="600" cy="315" r="215" fill="#f1f3f9" class="sky" opacity="0.5"/>
  <circle cx="200" cy="140" r="95" fill="#1f6f99" class="accent" opacity="0.14"/>
  <circle cx="1020" cy="145" r="62" fill="#f1f3f9" class="sky" opacity="0.5"/>
  <circle cx="1005" cy="470" r="110" fill="#f5bf2f" opacity="0.12"/>
  <circle cx="160" cy="490" r="45" fill="#2c343b" opacity="0.25"/>
  <!-- joining lines between the icons -->
  <g fill="none" stroke="#1f6f99" class="s-accent" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <line x1="600" y1="110" x2="815" y2="315"/>
    <line x1="815" y1="315" x2="600" y2="520"/>
    <line x1="600" y1="520" x2="385" y2="315"/>
    <line x1="385" y1="315" x2="600" y2="110"/>
  </g>
  <!-- small data dots on the lines -->
  <g fill="#f5bf2f">
    <circle cx="708" cy="212" r="7"/>
    <circle cx="708" cy="418" r="7"/>
    <circle cx="492" cy="418" r="7"/>
    <circle cx="492" cy="212" r="7"/>
  </g>
  <g fill="#2c343b">
    <circle cx="680" cy="186" r="5"/>
    <circle cx="465" cy="239" r="5"/>
  </g>
  <!-- icon: heart, top -->
  <circle cx="600" cy="110" r="80" fill="#f1f3f9" class="sky"/>
  <path d="M600 152 C 572 126, 550 106, 550 84 C 550 63, 566 50, 584 50 C 592 50, 599 55, 600 62 C 601 55, 608 50, 616 50 C 634 50, 650 63, 650 84 C 650 106, 628 126, 600 152 Z" fill="#f54b0f"/>
  <!-- icon: sugar molecule, right, a small cluster of circles -->
  <circle cx="815" cy="315" r="80" fill="#8668ad"/>
  <g fill="#ffffff" class="paper">
    <circle cx="815" cy="283" r="13"/>
    <circle cx="815" cy="347" r="13"/>
    <circle cx="783" cy="315" r="13"/>
    <circle cx="847" cy="315" r="13"/>
  </g>
  <circle cx="815" cy="315" r="21" fill="#f5bf2f"/>
  <circle cx="815" cy="315" r="6" fill="#272727" class="ink-strong"/>
  <!-- icon: virus, bottom, round body with short spikes -->
  <circle cx="600" cy="520" r="80" fill="#f1f3f9" class="sky"/>
  <g fill="none" stroke="#272727" class="s-ink-strong" stroke-width="9" stroke-linecap="round">
    <line x1="638" y1="520" x2="656" y2="520"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(45 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(90 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(135 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(180 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(225 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(270 600 520)"/>
    <line x1="638" y1="520" x2="656" y2="520" transform="rotate(315 600 520)"/>
  </g>
  <circle cx="600" cy="520" r="36" fill="#1f6f99" class="accent"/>
  <circle cx="588" cy="508" r="7" fill="#ffffff" class="paper"/>
  <circle cx="612" cy="530" r="7" fill="#ffffff" class="paper"/>
  <!-- icon: dna helix, left, two twisting ribbons -->
  <circle cx="385" cy="315" r="80" fill="#2c343b"/>
  <path d="M352 268 C 412 288, 412 342, 352 362" fill="none" stroke="#55bbeb" stroke-width="11" stroke-linecap="round"/>
  <path d="M418 268 C 358 288, 358 342, 418 362" fill="none" stroke="#f5bf2f" stroke-width="11" stroke-linecap="round"/>
</svg>
