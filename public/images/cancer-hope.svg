<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Two simple geometric hands cupping a small golden light with a soft glow in a deep field</title>
  <!--
    Flat drawing in the ADR 0008 palette. The light theme is drawn with
    literal fills (the reference's deep blue field, its light ink and its
    warm accent). The dark theme swaps the field for the reference's dark
    surface and the light ink for its pale ink, and keeps the same accent
    colours, so the drawing reads the same way in both themes. No
    JavaScript: the dark rule is a CSS rule inside the file.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .field { fill: #191919; }
      .paper { fill: #f1f3f9; }
      .s-paper { stroke: #f1f3f9; }
    }
  </style>
  <!-- deep field -->
  <rect x="0" y="0" width="800" height="600" fill="#1f6f99" class="field"/>
  <!-- large soft translucent shapes for depth -->
  <circle cx="400" cy="310" r="225" fill="#ffffff" class="paper" opacity="0.07"/>
  <circle cx="140" cy="115" r="95" fill="#55bbeb" opacity="0.30"/>
  <circle cx="680" cy="140" r="62" fill="#55bbeb" opacity="0.22"/>
  <circle cx="700" cy="480" r="125" fill="#f5bf2f" opacity="0.12"/>
  <circle cx="90" cy="490" r="85" fill="#f5bf2f" opacity="0.10"/>
  <!-- a few small scattered dots in the field -->
  <g fill="#ffffff" class="paper">
    <circle cx="105" cy="255" r="5" opacity="0.6"/>
    <circle cx="235" cy="75" r="4" opacity="0.45"/>
    <circle cx="575" cy="65" r="4" opacity="0.5"/>
    <circle cx="735" cy="290" r="5" opacity="0.55"/>
    <circle cx="645" cy="565" r="4" opacity="0.4"/>
    <circle cx="150" cy="565" r="4" opacity="0.4"/>
  </g>
  <!-- soft glow: layered translucent circles -->
  <circle cx="400" cy="300" r="150" fill="#f5bf2f" opacity="0.12"/>
  <circle cx="400" cy="300" r="105" fill="#f5bf2f" opacity="0.20"/>
  <circle cx="400" cy="300" r="68" fill="#f5bf2f" opacity="0.34"/>
  <!-- the small golden light -->
  <circle cx="400" cy="300" r="32" fill="#f5bf2f"/>
  <circle cx="409" cy="291" r="11" fill="#ffffff" class="paper"/>
  <!-- left hand: palm circle, finger sweep, thumb -->
  <circle cx="272" cy="500" r="100" fill="#ffffff" class="paper"/>
  <line x1="285" y1="485" x2="410" y2="408" fill="none" stroke="#ffffff" class="s-paper" stroke-width="64" stroke-linecap="round"/>
  <line x1="295" y1="462" x2="352" y2="388" fill="none" stroke="#ffffff" class="s-paper" stroke-width="42" stroke-linecap="round" opacity="0.85"/>
  <!-- right hand: palm circle, finger sweep, thumb -->
  <circle cx="528" cy="500" r="100" fill="#ffffff" class="paper"/>
  <line x1="515" y1="485" x2="390" y2="408" fill="none" stroke="#ffffff" class="s-paper" stroke-width="64" stroke-linecap="round"/>
  <line x1="505" y1="462" x2="448" y2="388" fill="none" stroke="#ffffff" class="s-paper" stroke-width="42" stroke-linecap="round" opacity="0.85"/>
</svg>
