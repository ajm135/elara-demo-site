<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Two simple geometric hands cupping a small amber light, with a soft glow, in a deep teal field</title>
  <!-- deep teal night field -->
  <rect x="0" y="0" width="800" height="600" fill="#0a544e"/>
  <!-- large soft translucent shapes for depth -->
  <circle cx="400" cy="310" r="225" fill="#d7e6e3" opacity="0.07"/>
  <circle cx="140" cy="115" r="95" fill="#0e6b63" opacity="0.45"/>
  <circle cx="680" cy="140" r="62" fill="#0e6b63" opacity="0.35"/>
  <circle cx="700" cy="480" r="125" fill="#c9842a" opacity="0.12"/>
  <circle cx="90" cy="490" r="85" fill="#c9842a" opacity="0.10"/>
  <!-- a few small scattered dots in the field -->
  <g fill="#d7e6e3">
    <circle cx="105" cy="255" r="5" opacity="0.6"/>
    <circle cx="235" cy="75" r="4" opacity="0.45"/>
    <circle cx="575" cy="65" r="4" opacity="0.5"/>
    <circle cx="735" cy="290" r="5" opacity="0.55"/>
    <circle cx="645" cy="565" r="4" opacity="0.4"/>
    <circle cx="150" cy="565" r="4" opacity="0.4"/>
  </g>
  <!-- soft glow: layered translucent circles -->
  <circle cx="400" cy="300" r="150" fill="#c9842a" opacity="0.10"/>
  <circle cx="400" cy="300" r="105" fill="#c9842a" opacity="0.18"/>
  <circle cx="400" cy="300" r="68" fill="#c9842a" opacity="0.32"/>
  <!-- the small amber light -->
  <circle cx="400" cy="300" r="32" fill="#c9842a"/>
  <circle cx="409" cy="291" r="11" fill="#f6f1e7"/>
  <!-- left hand: palm circle, finger sweep, thumb -->
  <circle cx="272" cy="500" r="100" fill="#d7e6e3"/>
  <line x1="285" y1="485" x2="410" y2="408" stroke="#d7e6e3" stroke-width="64" stroke-linecap="round"/>
  <line x1="295" y1="462" x2="352" y2="388" stroke="#f6f1e7" stroke-width="42" stroke-linecap="round"/>
  <!-- right hand: palm circle, finger sweep, thumb -->
  <circle cx="528" cy="500" r="100" fill="#d7e6e3"/>
  <line x1="515" y1="485" x2="390" y2="408" stroke="#d7e6e3" stroke-width="64" stroke-linecap="round"/>
  <line x1="505" y1="462" x2="448" y2="388" stroke="#f6f1e7" stroke-width="42" stroke-linecap="round"/>
</svg>
