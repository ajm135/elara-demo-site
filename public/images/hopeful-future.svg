<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A rising golden sun with short rays over a low landscape of rounded blue laboratory and hospital blocks, with a pale path leading toward them</title>
  <!--
    Flat drawing in the ADR 0008 palette. The light theme is drawn with
    literal fills (the reference's white and pale blue-grey surfaces, its
    blue accent and its remaining accent colours). The dark theme swaps
    the light surfaces for the reference's dark surfaces and the dark ink
    for the light ink, and lifts the blue accent to the reference's light
    blue, so the drawing reads the same way in both themes. No JavaScript:
    the dark rule is a CSS rule inside the file.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .field { fill: #191919; }
      .sky { fill: #2c343b; }
      .paper { fill: #f1f3f9; }
      .ink-strong { fill: #ffffff; }
      .accent { fill: #55bbeb; }
      .path-tone { fill: #191919; }
    }
  </style>
  <!-- full-canvas field -->
  <rect x="0" y="0" width="1200" height="630" rx="48" fill="#ffffff" class="field"/>
  <!-- wide pale sky -->
  <rect x="64" y="64" width="1072" height="396" rx="40" fill="#f1f3f9" class="sky"/>
  <!-- soft haze in the sky -->
  <circle cx="340" cy="210" r="110" fill="#1f6f99" class="accent" opacity="0.14"/>
  <circle cx="872" cy="164" r="84" fill="#1f6f99" class="accent" opacity="0.12"/>
  <!-- sunrise glow -->
  <circle cx="600" cy="420" r="235" fill="#f5bf2f" opacity="0.18"/>
  <!-- a few short rays -->
  <g stroke="#f5bf2f" stroke-width="16" stroke-linecap="round">
    <line x1="448" y1="332" x2="414" y2="312"/>
    <line x1="512" y1="268" x2="492" y2="234"/>
    <line x1="600" y1="245" x2="600" y2="205"/>
    <line x1="688" y1="268" x2="708" y2="234"/>
    <line x1="752" y1="332" x2="786" y2="312"/>
  </g>
  <!-- the golden sun disc -->
  <circle cx="600" cy="420" r="150" fill="#f5bf2f"/>
  <!-- low landscape, back band -->
  <rect x="80" y="456" width="1040" height="144" rx="72" fill="#1f6f99" class="accent" opacity="0.45"/>
  <!-- low landscape, front band -->
  <rect x="0" y="500" width="1200" height="130" fill="#1f6f99" class="accent"/>
  <!-- laboratory block, left -->
  <rect x="170" y="330" width="280" height="200" rx="36" fill="#8668ad"/>
  <circle cx="310" cy="400" r="26" fill="#ffffff" class="paper"/>
  <rect x="278" y="452" width="64" height="78" rx="32" fill="#ffffff" class="paper"/>
  <!-- hospital block, right, with a simple plus of two rounded bars -->
  <rect x="750" y="300" width="300" height="240" rx="40" fill="#55bbeb"/>
  <rect x="830" y="402" width="140" height="36" rx="18" fill="#272727" class="ink-strong"/>
  <rect x="882" y="350" width="36" height="140" rx="18" fill="#272727" class="ink-strong"/>
  <!-- short pale path leading up the middle -->
  <path d="M 582 468 L 618 468 Q 648 560 704 630 L 496 630 Q 552 560 582 468 Z" fill="#f1f3f9" class="path-tone"/>
</svg>
