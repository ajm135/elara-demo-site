<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A bright sunrise over simple laboratory and hospital buildings</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA9D6"/>
      <stop offset="0.6" stop-color="#A8D8EA"/>
      <stop offset="0.85" stop-color="#FFE29A"/>
      <stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFE9A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="472" fill="url(#sky)"/>
  <circle cx="600" cy="470" r="270" fill="url(#glow)"/>
  <g stroke="#FFD166" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="600" y1="322" x2="600" y2="284"/>
    <line x1="466" y1="366" x2="436" y2="336"/>
    <line x1="734" y1="366" x2="764" y2="336"/>
    <line x1="412" y1="455" x2="374" y2="455"/>
    <line x1="788" y1="455" x2="826" y2="455"/>
  </g>
  <circle cx="600" cy="470" r="96" fill="#FFD166"/>
  <rect x="0" y="470" width="1200" height="160" fill="#79A85B"/>
  <rect x="0" y="470" width="1200" height="12" fill="#5F8C46"/>
  <!-- laboratory building, left -->
  <rect x="140" y="300" width="310" height="172" rx="10" fill="#F6F3EC" stroke="#8A94A6" stroke-width="4"/>
  <rect x="140" y="300" width="310" height="36" rx="10" fill="#4E79A7"/>
  <rect x="176" y="362" width="62" height="58" rx="8" fill="#BEE3F8"/>
  <rect x="268" y="362" width="62" height="58" rx="8" fill="#BEE3F8"/>
  <rect x="360" y="362" width="62" height="58" rx="8" fill="#BEE3F8"/>
  <rect x="266" y="440" width="66" height="32" rx="6" fill="#4E79A7"/>
  <circle cx="295" cy="258" r="42" fill="#FFFFFF" stroke="#4E79A7" stroke-width="5"/>
  <rect x="281" y="222" width="28" height="10" rx="4" fill="#4E79A7"/>
  <path d="M288 232 h14 v16 l13 22 a8 8 0 0 1 -7 13 h-26 a8 8 0 0 1 -7 -13 l13 -22 z" fill="#6FCF97"/>
  <!-- hospital building, right -->
  <rect x="750" y="272" width="310" height="200" rx="10" fill="#F6F3EC" stroke="#8A94A6" stroke-width="4"/>
  <rect x="750" y="272" width="310" height="36" rx="10" fill="#C44536"/>
  <circle cx="905" cy="388" r="54" fill="#FFFFFF" stroke="#C44536" stroke-width="5"/>
  <rect x="890" y="352" width="30" height="72" rx="7" fill="#C44536"/>
  <rect x="869" y="373" width="72" height="30" rx="7" fill="#C44536"/>
  <rect x="782" y="330" width="48" height="44" rx="8" fill="#BEE3F8"/>
  <rect x="990" y="330" width="48" height="44" rx="8" fill="#BEE3F8"/>
  <!-- path and trees -->
  <rect x="560" y="472" width="80" height="158" fill="#D9C9A3"/>
  <rect x="88" y="486" width="12" height="40" fill="#8B5E3C"/>
  <circle cx="94" cy="462" r="32" fill="#5F8C46"/>
  <rect x="1108" y="492" width="12" height="36" fill="#8B5E3C"/>
  <circle cx="1114" cy="470" r="28" fill="#5F8C46"/>
</svg>
