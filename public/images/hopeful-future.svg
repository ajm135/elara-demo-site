<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>A rising amber sun with short rays over a low landscape of rounded teal laboratory and hospital blocks, with a pale path leading toward them</title>
  <!-- full-canvas warm cream field -->
  <rect x="0" y="0" width="1200" height="630" rx="48" fill="#f6f1e7"/>
  <!-- wide pale mist sky -->
  <rect x="64" y="64" width="1072" height="396" rx="40" fill="#d7e6e3"/>
  <!-- soft translucent haze in the sky -->
  <circle cx="340" cy="210" r="110" fill="#0e6b63" opacity="0.1"/>
  <circle cx="872" cy="164" r="84" fill="#0e6b63" opacity="0.1"/>
  <!-- warm sunrise glow -->
  <circle cx="600" cy="420" r="235" fill="#c9842a" opacity="0.18"/>
  <!-- a few short rays -->
  <g stroke="#c9842a" stroke-width="16" stroke-linecap="round">
    <line x1="448" y1="332" x2="414" y2="312"/>
    <line x1="512" y1="268" x2="492" y2="234"/>
    <line x1="600" y1="245" x2="600" y2="205"/>
    <line x1="688" y1="268" x2="708" y2="234"/>
    <line x1="752" y1="332" x2="786" y2="312"/>
  </g>
  <!-- the amber sun disc -->
  <circle cx="600" cy="420" r="150" fill="#c9842a"/>
  <!-- low landscape, back band -->
  <rect x="80" y="456" width="1040" height="144" rx="72" fill="#0e6b63" opacity="0.5"/>
  <!-- low landscape, front band -->
  <rect x="0" y="500" width="1200" height="130" fill="#0a544e"/>
  <!-- laboratory block, left -->
  <rect x="170" y="330" width="280" height="200" rx="36" fill="#0e6b63"/>
  <circle cx="310" cy="400" r="26" fill="#f6f1e7"/>
  <rect x="278" y="452" width="64" height="78" rx="32" fill="#f6f1e7"/>
  <!-- hospital block, right, with a simple plus of two rounded bars -->
  <rect x="750" y="300" width="300" height="240" rx="40" fill="#0a544e"/>
  <rect x="830" y="402" width="140" height="36" rx="18" fill="#f6f1e7"/>
  <rect x="882" y="350" width="36" height="140" rx="18" fill="#f6f1e7"/>
  <!-- short pale path leading up the middle -->
  <path d="M 582 468 L 618 468 Q 648 560 704 630 L 496 630 Q 552 560 582 468 Z" fill="#d7e6e3"/>
</svg>
